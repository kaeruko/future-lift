name: Flutter quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: python -m unittest discover -s tools/dialogue_cms -p 'test_*.py'
      - run: python -m unittest discover -s tools/android -p 'test_*.py'
      - run: python -m unittest discover -s tools/aws -p 'test_*.py'
      - run: flutter pub get
      # Run quality checks before the icon task: the latter currently fails
      # because the iOS project is not checked in. Keep its failure visible.
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
      - run: dart run flutter_launcher_icons
