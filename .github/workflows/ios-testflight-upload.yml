name: iOS TestFlight Upload

# Upload a previously successful signed IPA without rebuilding it.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Optional: leave blank to upload the latest successful iOS IPA build"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: kotohogu-testflight-upload
  cancel-in-progress: false

jobs:
  upload-testflight:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Resolve and verify source run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Only main may upload to TestFlight"
            exit 1
          }
          if [[ -n "$REQUESTED_RUN_ID" ]]; then
            [[ "$REQUESTED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::source_run_id must be numeric if provided"
              exit 1
            }
            SOURCE_RUN_ID="$REQUESTED_RUN_ID"
          else
            # GitHub assigns run IDs. Use the newest successful build from
            # this exact workflow on main, never a run from another workflow.
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ios-app-store.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=30" \
              > "$RUNNER_TEMP/source-runs.json"
            SOURCE_RUN_ID="$(jq -er --arg repo "$GITHUB_REPOSITORY" '
              [.workflow_runs[] |
                select(.status == "completed" and
                       .conclusion == "success" and
                       .head_branch == "main" and
                       .head_repository.full_name == $repo)] |
                sort_by(.created_at, .id) | last | .id // empty
            ' "$RUNNER_TEMP/source-runs.json")" || {
              echo "::error::No successful iOS App Store IPA run found on main"
              exit 1
            }
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            > "$RUNNER_TEMP/source-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .status == "completed" and
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_repository.full_name == $repo and
            (.path // "" | contains("ios-app-store.yml"))
          ' "$RUNNER_TEMP/source-run.json" >/dev/null || {
            echo "::error::Source run must be a successful main-branch iOS App Store IPA workflow run"
            exit 1
          }
          echo "run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          echo "Source run verified: $SOURCE_RUN_ID"

      - name: Download signed IPA from exact run
        uses: actions/download-artifact@v4
        with:
          name: kotohogu-app-store-ipa
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded-ipa

      - name: Verify IPA identity and Apple signature
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=(downloaded-ipa/*.ipa)
          [[ "${#ipas[@]}" -eq 1 ]] || {
            echo "::error::Expected exactly one IPA in source artifact"
            exit 1
          }
          ipa="${ipas[0]}"
          mkdir -p "$RUNNER_TEMP/verify-ipa"
          unzip -q "$ipa" -d "$RUNNER_TEMP/verify-ipa"
          apps=("$RUNNER_TEMP"/verify-ipa/Payload/*.app)
          [[ "${#apps[@]}" -eq 1 && -d "${apps[0]}" ]] || {
            echo "::error::Expected exactly one app in the signed IPA"
            exit 1
          }
          app="${apps[0]}"
          info="$app/Info.plist"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")
          display_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$info")
          build_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")
          build_number=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")

          [[ "$bundle_id" == "jp.cloxs.kotohogu" ]] || {
            echo "::error::Unexpected Bundle ID in IPA"
            exit 1
          }
          [[ "$display_name" == "ことほぐ" ]] || {
            echo "::error::Unexpected display name in IPA"
            exit 1
          }
          [[ "$build_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid IPA release version"
            exit 1
          }
          [[ "$build_number" =~ ^[0-9]+$ ]] || {
            echo "::error::Invalid IPA build number"
            exit 1
          }
          codesign --verify --deep --strict "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          grep -Fq 'Authority=Apple Distribution: CLOXS LLC' <<< "$signature" || {
            echo "::error::Unexpected IPA distribution certificate"
            exit 1
          }
          grep -Fq 'TeamIdentifier=H5B52RL9R2' <<< "$signature" || {
            echo "::error::IPA was not signed by the expected Apple team"
            exit 1
          }
          echo "VERIFIED_IPA=$ipa" >> "$GITHUB_ENV"
          {
            echo "### TestFlight upload source"
            echo "- Build run: $SOURCE_RUN_ID"
            echo "- Bundle: $bundle_id"
            echo "- Version: $build_name ($build_number)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "::error::Missing or invalid APP_STORE_CONNECT_API_KEY_ID"
            exit 1
          }
          [[ -n "$ASC_ISSUER_ID" && -n "$ASC_KEY_BASE64" ]] || {
            echo "::error::Missing APP_STORE_CONNECT_ISSUER_ID or APP_STORE_CONNECT_API_KEY_P8_BASE64"
            exit 1
          }
          umask 077
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 -D > "$key_path"
          test -s "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path" || {
            echo "::error::Invalid App Store Connect .p8 secret"
            exit 1
          }
          chmod 600 "$key_path"

      - name: Validate and upload to TestFlight
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --file "$VERIFIED_IPA" --type ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app \
            --file "$VERIFIED_IPA" --type ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "- Uploaded successfully; wait for Apple processing in App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up API key and downloaded app
        if: always()
        shell: bash
        run: |
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/verify-ipa"
          rm -f "$RUNNER_TEMP/source-run.json" "$RUNNER_TEMP/source-runs.json"
